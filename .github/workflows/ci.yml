name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REAL_MODEL: "0"
      MODEL_MODE: faux
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository without recursive submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize only the pinned upstream
        run: git -c submodule.recurse=false submodule update --init -- vendor/ruwen
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          run_install: false
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify approved upstream prompt sources
        run: pnpm check:prompt-sources
      - name: Lint, typecheck and unit tests
        run: pnpm lint && pnpm typecheck && pnpm test:fast
  full:
    name: full
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ruwen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ruwen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ruwen_test
      PYTHON_BIN: python
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      REAL_MODEL: "0"
      MODEL_MODE: faux
      RUWEN_CANARY: CI_FAUX_ONLY_CANARY_20261111
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository without recursive submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize only the pinned upstream
        run: git -c submodule.recurse=false submodule update --init -- vendor/ruwen
      - name: Set up Python for differential tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          run_install: false
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify approved upstream prompt sources
        run: pnpm check:prompt-sources
      - name: Integration, invariant, parity and recovery tests with faux models
        run: pnpm test
      - name: Install Chromium for full browser acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: All browser tests with faux models
        run: pnpm test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
