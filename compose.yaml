services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ruwen_test
      POSTGRES_USER: ruwen
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ruwen_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruwen -d ruwen_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  ruwen_postgres:
